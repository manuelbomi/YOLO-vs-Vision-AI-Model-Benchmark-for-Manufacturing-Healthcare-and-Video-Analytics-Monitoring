# One-command "plug and play" deployment: RTSP camera simulators (one per
# scenario) + API + frontend.
#
#   docker compose up --build
#
# Then open http://localhost:3001. Ports are deliberately non-default
# (8010/3001 rather than 8000/3000) because those are common defaults many
# developers already have something else running on -- see README >
# Quickstart for the exact reasoning (this repo was built alongside other
# local services that already claimed 8000/3000).
services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554" # RTSP
    restart: unless-stopped

  camera-sim-manufacturing:
    image: linuxserver/ffmpeg:latest
    depends_on:
      - mediamtx
    volumes:
      - ./data/samples/manufacturing:/data:ro
    entrypoint: ["ffmpeg"]
    command:
      [
        "-re", "-stream_loop", "-1", "-i", "/data/demo_clip.mp4",
        "-c", "copy", "-f", "rtsp", "rtsp://mediamtx:8554/demo-manufacturing",
      ]
    restart: unless-stopped

  camera-sim-healthcare:
    image: linuxserver/ffmpeg:latest
    depends_on:
      - mediamtx
    volumes:
      - ./data/samples/healthcare:/data:ro
    entrypoint: ["ffmpeg"]
    command:
      [
        "-re", "-stream_loop", "-1", "-i", "/data/demo_clip.mp4",
        "-c", "copy", "-f", "rtsp", "rtsp://mediamtx:8554/demo-healthcare",
      ]
    restart: unless-stopped

  camera-sim-video-analytics:
    image: linuxserver/ffmpeg:latest
    depends_on:
      - mediamtx
    volumes:
      - ./data/samples/video_analytics:/data:ro
    entrypoint: ["ffmpeg"]
    command:
      [
        "-re", "-stream_loop", "-1", "-i", "/data/demo_clip.mp4",
        "-c", "copy", "-f", "rtsp", "rtsp://mediamtx:8554/demo-video-analytics",
      ]
    restart: unless-stopped

  # TURN server for WebRTC across restrictive NATs (see README > Known
  # limitations). Static demo credentials below are fine for local/LAN
  # use only -- rotate them (and set a real --external-ip) before exposing
  # this to the internet. Without this service, WebRTC still works for
  # same-machine/LAN use via the public STUN server the frontend also
  # configures; TURN is only needed when a peer is behind a NAT that STUN
  # alone can't traverse.
  coturn:
    image: coturn/coturn:latest
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --realm=vision-benchmark.local
      - --user=vbdemo:vbdemo
      - --no-cli
      - --min-port=49160
      - --max-port=49200
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8010:8000"
    environment:
      - DEMO_RTSP_URL_MANUFACTURING=rtsp://mediamtx:8554/demo-manufacturing
      - DEMO_RTSP_URL_HEALTHCARE=rtsp://mediamtx:8554/demo-healthcare
      - DEMO_RTSP_URL_VIDEO_ANALYTICS=rtsp://mediamtx:8554/demo-video-analytics
      - CORS_ORIGINS=http://localhost:3001,http://127.0.0.1:3001
    depends_on:
      - mediamtx
      - camera-sim-manufacturing
      - camera-sim-healthcare
      - camera-sim-video-analytics
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8010
        VITE_TURN_URL: turn:localhost:3478
        VITE_TURN_USERNAME: vbdemo
        VITE_TURN_CREDENTIAL: vbdemo
    ports:
      - "3001:80"
    depends_on:
      - api
      - coturn
