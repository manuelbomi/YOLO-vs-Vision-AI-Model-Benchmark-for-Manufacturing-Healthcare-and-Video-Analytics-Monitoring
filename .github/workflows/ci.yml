name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - name: Run tests
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the full stack
        run: docker compose up --build -d
      - name: Wait for the API to report ready
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8010/api/health && break
            sleep 3
          done
          curl -sf http://127.0.0.1:8010/api/health | grep '"models_ready":true'
      - name: Smoke-test the Arena endpoint against a bundled sample
        run: |
          curl -sf -X POST "http://127.0.0.1:8010/api/arena/compare" \
            -F "sample_path=manufacturing/warehouse_1.jpg" | grep image_width
      - name: Smoke-test all 3 scenarios' live RTSP feeds
        run: |
          sleep 5  # give the camera-sim containers a moment to start looping
          for scenario in manufacturing healthcare video_analytics; do
            bytes=$(curl -sf "http://127.0.0.1:8010/api/live/stream?model=YOLO11n&source=$scenario" --max-time 8 -o /dev/null -w "%{size_download}")
            echo "$scenario: $bytes bytes"
            [ "$bytes" -gt 10000 ] || { echo "::error::$scenario live stream produced too little data"; exit 1; }
          done
      - name: Smoke-test the frontend is served
        run: curl -sf http://127.0.0.1:3001/ | grep "Vision Model Benchmark"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down
